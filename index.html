<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逍遥学习字帖</title>
    
    <!-- 引入核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4E1 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 可爱的云朵装饰 */
        .cloud {
            position: fixed;
            background: white;
            border-radius: 100px;
            opacity: 0.7;
            animation: float 20s infinite ease-in-out;
        }

        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 50px;
            left: 10%;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1:after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 80px;
            height: 35px;
            top: 150px;
            right: 15%;
            animation-delay: 3s;
        }

        .cloud2:before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 10px;
        }

        .cloud2:after {
            width: 50px;
            height: 35px;
            top: -12px;
            right: 10px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.6s ease-in;
            border: 4px solid #FFB6C1;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            color: #FF69B4;
            margin-bottom: 20px;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,105,180,0.3);
            letter-spacing: 3px;
        }

        /* 分类选择区域 */
        .categories {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .category-btn {
            padding: 10px 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,182,193,0.3);
        }

        .category-btn:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 6px 15px rgba(255,182,193,0.5);
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        /* 汉字卡片区域 */
        .char-cards {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #FFF8DC;
            border-radius: 15px;
            border: 3px dashed #FFB6C1;
        }

        .char-cards.active {
            display: flex;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .char-card {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #87CEEB;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .char-card:hover {
            background: #87CEEB;
            color: white;
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 5px 15px rgba(135,206,235,0.4);
        }

        .input-group {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            padding: 14px;
            font-size: 20px;
            border: 3px solid #FFB6C1;
            border-radius: 15px;
            width: 180px;
            text-align: center;
            transition: all 0.3s;
            font-weight: bold;
            background: #FFFACD;
        }

        input:focus {
            border-color: #FF69B4;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255,105,180,0.2);
            transform: scale(1.05);
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255,105,180,0.3);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255,105,180,0.5);
        }

        button:active {
            transform: translateY(0) scale(1);
        }

        /* 汉字展示区 */
        .character-display {
            margin: 0 auto;
            position: relative;
            width: 100%;
            max-width: 300px;
        }

        #pinyin-display {
            font-size: 40px;
            color: #FF6347;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 55px;
            text-shadow: 2px 2px 6px rgba(255,99,71,0.3);
            background: linear-gradient(135deg, #FF6347 0%, #FF69B4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-wrap: break-word;
        }

        #grid-target {
            margin: 0 auto;
            border: 4px solid #87CEEB;
            background-color: #FFFEF0;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(135,206,235,0.3);
            width: 100%;
            max-width: 300px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: white;
            border: 3px solid #87CEEB;
            color: #4169E1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(135,206,235,0.2);
        }
        
        .btn-outline:hover {
            background: linear-gradient(135deg, #87CEEB 0%, #4169E1 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-3px) scale(1.05);
        }

        /* 田字格开关 */
        .grid-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            padding: 8px 15px;
            background: #FFF8DC;
            border-radius: 20px;
            border: 2px solid #FFB6C1;
            display: inline-flex;
        }

        .grid-toggle label {
            font-size: 14px;
            font-weight: bold;
            color: #FF69B4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 可爱的开关按钮 */
        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        .footer {
            margin-top: 25px;
            color: #FF69B4;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            position: relative;
            z-index: 1;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 26px;
                letter-spacing: 2px;
            }

            .category-btn {
                font-size: 13px;
                padding: 8px 14px;
            }

            .char-card {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .character-display {
                width: 100%;
                max-width: 280px;
            }

            #pinyin-display {
                font-size: 32px;
                min-height: 45px;
            }

            #grid-target {
                max-width: 280px;
            }

            button {
                font-size: 15px;
                padding: 11px 18px;
            }

            .btn-outline {
                font-size: 13px;
                padding: 9px 16px;
            }

            input {
                width: 140px;
                font-size: 18px;
                padding: 12px;
            }

            .grid-toggle {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 18px 12px;
            }

            h1 {
                font-size: 22px;
                letter-spacing: 1px;
                margin-bottom: 15px;
            }

            .categories {
                gap: 8px;
                margin-bottom: 18px;
            }

            .category-btn {
                font-size: 12px;
                padding: 7px 12px;
            }

            .char-cards {
                gap: 8px;
                padding: 12px;
            }

            .char-card {
                width: 42px;
                height: 42px;
                font-size: 18px;
                border: 2px solid #87CEEB;
            }

            .character-display {
                width: 100%;
                max-width: 240px;
            }

            #pinyin-display {
                font-size: 28px;
                min-height: 40px;
                margin-bottom: 12px;
            }

            #grid-target {
                max-width: 240px;
                border: 3px solid #87CEEB;
            }

            .input-group {
                gap: 8px;
                margin-bottom: 18px;
            }

            input {
                width: 120px;
                font-size: 16px;
                padding: 10px;
                border: 2px solid #FFB6C1;
            }

            button {
                font-size: 14px;
                padding: 10px 16px;
            }

            .controls {
                gap: 8px;
                margin-top: 18px;
            }

            .btn-outline {
                font-size: 12px;
                padding: 8px 14px;
            }

            .grid-toggle {
                margin-top: 12px;
                padding: 6px 12px;
            }

            .grid-toggle label {
                font-size: 12px;
            }

            .switch {
                width: 40px;
                height: 20px;
            }

            .slider:before {
                height: 14px;
                width: 14px;
            }

            input:checked + .slider:before {
                transform: translateX(20px);
            }

            .footer {
                font-size: 13px;
                margin-top: 18px;
            }
        }

        /* 加载提示 */
        .loading {
            display: none;
            color: #FF69B4;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .loading.active {
            display: block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

    </style>
</head>
<body>

    <!-- 云朵装饰 -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="container">
        <h1>🎨 逍遥学习字帖 🌈</h1>
        
        <!-- 分类选择 -->
        <div class="categories">
            <button class="category-btn" onclick="showCategory('animals')">🐾 动物</button>
            <button class="category-btn" onclick="showCategory('family')">👨‍👩‍👧‍👦 家人</button>
            <button class="category-btn" onclick="showCategory('plants')">🌱 植物</button>
            <button class="category-btn" onclick="showCategory('fruits')">🍎 水果</button>
            <button class="category-btn" onclick="showCategory('colors')">🎨 颜色</button>
            <button class="category-btn" onclick="showCategory('numbers')">🔢 数字</button>
            <button class="category-btn" onclick="showCategory('weather')">☀️ 天气</button>
            <button class="category-btn" onclick="showCategory('body')">👋 身体</button>
        </div>

        <!-- 汉字卡片显示区 -->
        <div class="char-cards" id="charCards"></div>
        
        <div class="input-group">
            <input type="text" id="charInput" placeholder="输入汉字" maxlength="1" value="猫">
            <button onclick="loadCharacter()">🚀 开始学习</button>
        </div>

        <div class="loading" id="loading">✨ 正在加载中...</div>

        <div class="character-display">
            <!-- 拼音显示 -->
            <div id="pinyin-display">māo</div>
            <!-- 田字格和汉字渲染区域 -->
            <div id="grid-target"></div>
        </div>

        <div class="controls">
            <button class="btn-outline" onclick="animateChar()">📝 播放动画</button>
            <button class="btn-outline" onclick="quizMode()">✍️ 描红练习</button>
            <button class="btn-outline" onclick="speak()">🔊 听发音</button>
        </div>

        <!-- 田字格开关 -->
        <div class="grid-toggle">
            <label for="gridSwitch">
                <span>📐 田字格</span>
            </label>
            <label class="switch">
                <input type="checkbox" id="gridSwitch" checked onchange="toggleGrid()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="footer">
        <p>🌟 点击分类按钮选择汉字，或者自己输入想学的字 🌟</p>
    </div>

    <script>
        let writer;
        const { pinyin } = pinyinPro; // 初始化拼音库
        let showGrid = true; // 田字格开关状态

        // 常用字分类数据库
        const charCategories = {
            animals: ['猫', '狗', '鸟', '鱼', '马', '牛', '羊', '兔', '鸡', '鸭', '象', '虎', '龙', '蛇', '鼠', '猪'],
            family: ['爸', '妈', '哥', '姐', '弟', '妹', '爷', '奶', '叔', '姨', '舅', '姑', '家', '人', '我', '你'],
            plants: ['花', '草', '树', '叶', '根', '枝', '竹', '松', '梅', '兰', '荷', '菊', '木', '林', '森', '苗'],
            fruits: ['苹', '果', '梨', '桃', '橙', '柚', '瓜', '莓', '葡', '萄', '香', '蕉', '枣', '李', '杏', '柿'],
            colors: ['红', '黄', '蓝', '绿', '白', '黑', '紫', '粉', '橙', '灰', '金', '银', '彩', '色'],
            numbers: ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '百', '千', '万', '零'],
            weather: ['晴', '雨', '雪', '风', '云', '雷', '电', '霜', '雾', '冰', '热', '冷', '暖', '凉'],
            body: ['手', '脚', '头', '眼', '耳', '口', '鼻', '牙', '舌', '心', '肚', '腿', '臂', '指', '发', '脸']
        };

        let currentCategory = null;

        // 显示分类汉字
        function showCategory(category) {
            currentCategory = category;
            const cardsContainer = document.getElementById('charCards');
            const chars = charCategories[category];
            
            // 生成汉字卡片
            cardsContainer.innerHTML = chars.map(char => 
                `<div class="char-card" onclick="selectChar('${char}')">${char}</div>`
            ).join('');
            
            // 显示卡片区域
            cardsContainer.classList.add('active');
            
            // 滚动到卡片区域
            cardsContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 选择汉字
        function selectChar(char) {
            document.getElementById('charInput').value = char;
            loadCharacter();
            // 滚动到学习区域
            document.getElementById('grid-target').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 初始化加载
        window.onload = function() {
            loadCharacter();
        };

        // 核心功能：加载汉字
        function loadCharacter() {
            const char = document.getElementById('charInput').value.trim();
            
            if (!char || !/^[\u4e00-\u9fa5]$/.test(char)) {
                alert("请输入一个中文汉字！");
                document.getElementById('charInput').focus();
                return;
            }

            // 显示加载状态
            const loading = document.getElementById('loading');
            loading.classList.add('active');

            try {
                // 1. 获取拼音
                const py = pinyin(char, { toneType: 'symbol' }); // 获取带声调拼音
                document.getElementById('pinyin-display').innerText = py;

                // 2. 清空旧的 canvas
                document.getElementById('grid-target').innerHTML = '';

                // 3. 根据屏幕尺寸动态设置大小
                const containerWidth = document.getElementById('grid-target').offsetWidth || 300;
                const writerSize = Math.min(containerWidth, 300);

                // 4. 初始化 Hanzi Writer
                const writerOptions = {
                    width: writerSize,
                    height: writerSize,
                    padding: 5,
                    showOutline: true, // 显示灰色轮廓
                    strokeAnimationSpeed: 1.2, // 动画速度（稍慢便于儿童观察）
                    delayBetweenStrokes: 300, // 笔画间隔
                    radicalsColor: '#FF69B4', // 偏旁部首颜色
                    showCharacter: true,
                    showHintAfterMisses: 2, // 2次错误后显示提示
                    highlightOnComplete: true,
                    outlineColor: '#FFB6C1',
                    strokeColor: '#4169E1', // 笔画颜色
                    drawingColor: '#FF69B4' // 描红时的颜色
                };

                writer = HanziWriter.create('grid-target', char, writerOptions);

                // 添加田字格
                addCustomGrid(writerSize);
                
                // 隐藏加载状态
                loading.classList.remove('active');
                
                // 自动播放一次动画
                setTimeout(animateChar, 800);
            } catch (error) {
                loading.classList.remove('active');
                console.error('加载汉字失败:', error);
                alert('加载汉字失败，请检查网络连接或尝试其他汉字');
            }
        }

        // 功能：播放笔顺动画
        function animateChar() {
            if(writer) {
                writer.animateCharacter();
            } else {
                alert('请先加载一个汉字');
            }
        }

        // 功能：描红测验模式（用户自己写）
        function quizMode() {
            if(writer) {
                writer.quiz({
                    onMistake: function(strokeData) {
                        console.log('写错了！当前笔画:', strokeData.strokeNum);
                    },
                    onCorrectStroke: function(strokeData) {
                        console.log('这一笔对了！完成进度:', strokeData.strokeNum + 1);
                    },
                    onComplete: function(summaryData) {
                        const char = document.getElementById('charInput').value;
                        const totalStrokes = summaryData.totalMistakes + summaryData.strokesRemaining;
                        const mistakes = summaryData.totalMistakes;
                        
                        let message = '';
                        if (mistakes === 0) {
                            message = `🎉 太棒了！「${char}」写得真好！\n全部正确，你真聪明！⭐⭐⭐`;
                        } else if (mistakes <= 3) {
                            message = `😊 很不错！「${char}」写得挺好的！\n再练习一下会更棒哦！⭐⭐`;
                        } else {
                            message = `💪 加油！「${char}」已经完成啦！\n多练几次就能写得很好！⭐`;
                        }
                        
                        alert(message);
                        // 完成后不自动播放语音，由用户自己点击
                        
                        // 播放完成动画
                        setTimeout(() => {
                            animateChar();
                        }, 500);
                    }
                });
            } else {
                alert('请先加载一个汉字');
            }
        }

        // 功能：文字转语音 (TTS)
        function speak() {
            const char = document.getElementById('charInput').value.trim();
            if (!char) return;
            
            if ('speechSynthesis' in window) {
                // 停止之前的语音
                window.speechSynthesis.cancel();
                
                // 等待语音合成器准备好
                const speakChar = () => {
                    const utterance = new SpeechSynthesisUtterance(char);
                    utterance.lang = 'zh-CN'; // 设置为中文
                    utterance.rate = 0.8; // 语速稍慢
                    utterance.pitch = 1; // 音调
                    utterance.volume = 1; // 音量
                    
                    // 添加错误处理
                    utterance.onerror = function(event) {
                        console.error('语音播放错误:', event);
                        // 如果浏览器不支持中文语音，尝试使用默认语言
                        if (event.error === 'language-unavailable') {
                            // 使用百度语音API作为备选
                            useFallbackTTS(char);
                        }
                    };
                    
                    utterance.onend = function() {
                        console.log('语音播放完成');
                    };
                    
                    window.speechSynthesis.speak(utterance);
                };

                // 移动端需要先获取语音列表
                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.addEventListener('voiceschanged', function() {
                        speakChar();
                    }, { once: true });
                    
                    // 设置超时，如果3秒内没有获取到声音列表，直接播放
                    setTimeout(() => {
                        if (window.speechSynthesis.speaking === false) {
                            speakChar();
                        }
                    }, 3000);
                } else {
                    speakChar();
                }
            } else {
                // 浏览器不支持Web Speech API，使用备选方案
                useFallbackTTS(char);
            }
        }

        // 备选TTS方案：使用百度或其他在线TTS服务
        function useFallbackTTS(text) {
            try {
                // 方案1：使用百度在线TTS（免费，无需API key）
                const audio = new Audio();
                // 百度TTS接口（有限制，仅作演示）
                const url = `https://fanyi.baidu.com/gettts?lan=zh&text=${encodeURIComponent(text)}&spd=3&source=web`;
                
                audio.src = url;
                audio.play().catch(err => {
                    console.error('音频播放失败:', err);
                    // 如果还是失败，提示用户
                    showToast('💡 请点击"🔊 听发音"按钮来播放语音');
                });
            } catch (error) {
                console.error('备选TTS失败:', error);
                showToast('⚠️ 语音播放暂时不可用');
            }
        }

        // 显示提示信息
        function showToast(message) {
            // 创建或获取提示元素
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 80px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(255, 105, 180, 0.95);
                    color: white;
                    padding: 12px 24px;
                    border-radius: 25px;
                    font-size: 14px;
                    font-weight: bold;
                    z-index: 9999;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                    animation: slideUp 0.3s ease-out;
                    max-width: 80%;
                    text-align: center;
                `;
                document.body.appendChild(toast);
                
                // 添加动画样式
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideUp {
                        from {
                            opacity: 0;
                            transform: translateX(-50%) translateY(20px);
                        }
                        to {
                            opacity: 1;
                            transform: translateX(-50%) translateY(0);
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            toast.textContent = message;
            toast.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 监听回车键
        document.getElementById('charInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadCharacter();
            }
        });

        // 自动聚焦输入框
        document.getElementById('charInput').addEventListener('click', function() {
            this.select();
        });

        // 添加自定义田字格
        function addCustomGrid(size = 300) {
            setTimeout(() => {
                const svg = document.querySelector('#grid-target svg');
                if (!svg) return;

                // 移除之前的田字格（如果有）
                const oldGrid = svg.querySelector('#custom-grid');
                if (oldGrid) oldGrid.remove();

                // 创建田字格组
                const gridGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gridGroup.setAttribute('id', 'custom-grid');
                gridGroup.style.display = showGrid ? 'block' : 'none';

                // 获取 SVG 尺寸
                const width = size;
                const height = size;
                const halfW = width / 2;
                const halfH = height / 2;

                // 创建虚线样式
                const lineStyle = {
                    stroke: '#FFB6C1',
                    strokeWidth: '1.5',
                    strokeDasharray: '5,5',
                    strokeLinecap: 'round'
                };

                // 横向中线
                const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                hLine.setAttribute('x1', '0');
                hLine.setAttribute('y1', halfH.toString());
                hLine.setAttribute('x2', width.toString());
                hLine.setAttribute('y2', halfH.toString());
                Object.entries(lineStyle).forEach(([key, value]) => {
                    hLine.setAttribute(key, value);
                });

                // 纵向中线
                const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                vLine.setAttribute('x1', halfW.toString());
                vLine.setAttribute('y1', '0');
                vLine.setAttribute('x2', halfW.toString());
                vLine.setAttribute('y2', height.toString());
                Object.entries(lineStyle).forEach(([key, value]) => {
                    vLine.setAttribute(key, value);
                });

                // 添加到组
                gridGroup.appendChild(hLine);
                gridGroup.appendChild(vLine);

                // 插入到 SVG 的最前面（背景层）
                svg.insertBefore(gridGroup, svg.firstChild);
            }, 100);
        }

        // 切换田字格显示
        function toggleGrid() {
            showGrid = document.getElementById('gridSwitch').checked;
            const gridGroup = document.querySelector('#custom-grid');
            if (gridGroup) {
                gridGroup.style.display = showGrid ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
