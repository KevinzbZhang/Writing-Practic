<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逍遥学习字帖</title>
    
    <!-- 引入核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4E1 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 可爱的云朵装饰 */
        .cloud {
            position: fixed;
            background: white;
            border-radius: 100px;
            opacity: 0.7;
            animation: float 20s infinite ease-in-out;
        }

        .cloud:before, .cloud:after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 50px;
            left: 10%;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1:after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 80px;
            height: 35px;
            top: 150px;
            right: 15%;
            animation-delay: 3s;
        }

        .cloud2:before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 10px;
        }

        .cloud2:after {
            width: 50px;
            height: 35px;
            top: -12px;
            right: 10px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.6s ease-in;
            border: 4px solid #FFB6C1;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            color: #FF69B4;
            margin-bottom: 15px;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255,105,180,0.3);
            letter-spacing: 3px;
        }

        /* 提示文字 */
        .hint-text {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            font-weight: normal;
            text-align: center;
        }

        .hint-text p {
            margin: 0;
        }

        /* 分类选择区域 */
        .categories {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .category-btn {
            padding: 10px 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #FFB6C1 0%, #FFC0CB 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,182,193,0.3);
        }

        .category-btn:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 6px 15px rgba(255,182,193,0.5);
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        /* 汉字卡片区域 */
        .char-cards {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #FFF8DC;
            border-radius: 15px;
            border: 3px dashed #FFB6C1;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #FFB6C1 #FFF8DC;
        }

        .char-cards::-webkit-scrollbar {
            height: 6px;
        }

        .char-cards::-webkit-scrollbar-track {
            background: #FFF8DC;
            border-radius: 10px;
        }

        .char-cards::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            border-radius: 10px;
        }

        .char-cards.active {
            display: flex;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .char-card {
            height: 60px;
            width: 60px;
            min-width: 60px;
            background: white;
            border: 3px solid #87CEEB;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
            padding: 0 10px;
        }

        /* 词组卡片样式 - 根据字数自适应宽度 */
        .char-card.word-card {
            width: auto;
            min-width: auto;
            padding: 0 15px;
            white-space: nowrap;
        }

        .char-card:hover {
            background: #87CEEB;
            color: white;
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 5px 15px rgba(135,206,235,0.4);
        }

        .input-group {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            padding: 14px;
            font-size: 20px;
            border: 3px solid #FFB6C1;
            border-radius: 15px;
            width: 180px;
            text-align: center;
            transition: all 0.3s;
            font-weight: bold;
            background: #FFFACD;
        }

        input:focus {
            border-color: #FF69B4;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255,105,180,0.2);
            transform: scale(1.05);
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255,105,180,0.3);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255,105,180,0.5);
        }

        button:active {
            transform: translateY(0) scale(1);
        }

        /* 多字符横向滑动容器 */
        .characters-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #FFB6C1 #FFF8DC;
            justify-content: flex-start;
        }

        /* 单个字时居中显示 */
        .characters-container.single-char {
            justify-content: center;
        }

        .characters-container::-webkit-scrollbar {
            height: 8px;
        }

        .characters-container::-webkit-scrollbar-track {
            background: #FFF8DC;
            border-radius: 10px;
        }

        .characters-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            border-radius: 10px;
        }

        /* 单个汉字展示区 */
        .character-display {
            min-width: 320px;
            max-width: 320px;
            flex-shrink: 0;
            position: relative;
            scroll-snap-align: center;
            background: linear-gradient(135deg, #FFFEF0 0%, #FFF8DC 100%);
            border: 3px solid #FFB6C1;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(255,182,193,0.3);
        }

        .pinyin-display {
            font-size: 36px;
            color: #FF6347;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 50px;
            text-shadow: 2px 2px 6px rgba(255,99,71,0.3);
            background: linear-gradient(135deg, #FF6347 0%, #FF69B4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .grid-target {
            margin: 0 auto;
            border: 4px solid #87CEEB;
            background-color: #FFFEF0;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(135,206,235,0.3);
            width: 100%;
            max-width: 260px;
        }

        .char-controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .char-controls button {
            font-size: 13px;
            padding: 8px 14px;
        }

        /* AI 写法提示 */
        .ai-tips {
            margin: 15px auto 0;
            padding: 15px 20px 15px 20px;
            background: linear-gradient(135deg, #FFF8DC 0%, #FFEFD5 100%);
            border: 3px solid #FFD700;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease-in;
            display: flex;
            flex-direction: column;
        }

        .ai-tips.show {
            opacity: 1;
        }

        .ai-tips-title {
            color: #FF8C00;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speak-ai-btn {
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(255,105,180,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .speak-ai-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255,105,180,0.5);
        }

        .speak-ai-btn:active {
            transform: scale(0.95);
        }

        .ai-tips-content {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            text-align: left;
            min-height: 72px;
            max-height: 72px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .ai-tips-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FF69B4;
            font-size: 14px;
        }

        .ai-tips-loading::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .ai-tips-error {
            color: #999;
            font-size: 13px;
            font-style: italic;
        }

        #grid-target {
            margin: 0 auto;
            border: 4px solid #87CEEB;
            background-color: #FFFEF0;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(135,206,235,0.3);
            width: 100%;
            max-width: 300px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 全局控制按钮 */
        .global-controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .global-controls .grid-toggle {
            margin: 0;
        }

        .btn-outline {
            background: white;
            border: 3px solid #87CEEB;
            color: #4169E1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(135,206,235,0.2);
        }
        
        .btn-outline:hover {
            background: linear-gradient(135deg, #87CEEB 0%, #4169E1 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-3px) scale(1.05);
        }

        /* 田字格开关 */
        .grid-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 15px;
            background: #FFF8DC;
            border-radius: 20px;
            border: 2px solid #FFB6C1;
        }

        .grid-toggle label {
            font-size: 14px;
            font-weight: bold;
            color: #FF69B4;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 可爱的开关按钮 */
        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 100%);
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        .footer {
            margin-top: 25px;
            color: #FF69B4;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            position: relative;
            z-index: 1;
            display: none;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 26px;
                letter-spacing: 2px;
            }

            .category-btn {
                font-size: 13px;
                padding: 8px 14px;
            }

            .char-card {
                width: 48px;
                min-width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .char-card.word-card {
                width: auto;
                min-width: auto;
            }

            .character-display {
                min-width: 280px;
                max-width: 280px;
                padding: 15px;
            }

            .pinyin-display {
                font-size: 32px;
                min-height: 45px;
            }

            .grid-target {
                max-width: 240px;
            }

            button {
                font-size: 15px;
                padding: 11px 18px;
            }

            .btn-outline {
                font-size: 13px;
                padding: 9px 16px;
            }

            input {
                width: 140px;
                font-size: 18px;
                padding: 12px;
            }

            .grid-toggle {
                font-size: 13px;
            }

            .char-controls button {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 18px 12px;
            }

            h1 {
                font-size: 22px;
                letter-spacing: 1px;
                margin-bottom: 15px;
            }

            .categories {
                gap: 8px;
                margin-bottom: 18px;
            }

            .category-btn {
                font-size: 12px;
                padding: 7px 12px;
            }

            .char-cards {
                gap: 8px;
                padding: 12px;
            }

            .char-card {
                width: 42px;
                min-width: 42px;
                height: 42px;
                font-size: 18px;
                border: 2px solid #87CEEB;
            }

            .char-card.word-card {
                width: auto;
                min-width: auto;
            }

            .character-display {
                min-width: 240px;
                max-width: 240px;
                padding: 12px;
            }

            .pinyin-display {
                font-size: 28px;
                min-height: 40px;
                margin-bottom: 12px;
            }

            .grid-target {
                max-width: 200px;
                border: 3px solid #87CEEB;
            }

            .input-group {
                gap: 8px;
                margin-bottom: 18px;
            }

            input {
                width: 120px;
                font-size: 16px;
                padding: 10px;
                border: 2px solid #FFB6C1;
            }

            button {
                font-size: 14px;
                padding: 10px 16px;
            }

            .controls {
                gap: 8px;
                margin-top: 18px;
            }

            .btn-outline {
                font-size: 12px;
                padding: 8px 14px;
            }

            .grid-toggle {
                padding: 6px 12px;
            }

            .grid-toggle label {
                font-size: 12px;
            }

            .ai-tips {
                margin: 12px auto 0;
                padding: 12px 16px 12px 16px;
            }

            .ai-tips-content {
                font-size: 13px;
                line-height: 1.5;
                min-height: 58px;
                max-height: 58px;
            }

            .switch {
                width: 40px;
                height: 20px;
            }

            .slider:before {
                height: 14px;
                width: 14px;
            }

            input:checked + .slider:before {
                transform: translateX(20px);
            }

            .ai-tips {
                margin: 12px auto 0;
                padding: 12px 16px;
                min-height: 90px;
            }

            .ai-tips::before {
                font-size: 20px;
                top: -12px;
                left: 10px;
                padding: 3px 8px;
            }

            .ai-tips-title {
                font-size: 13px;
            }

            .ai-tips-content {
                font-size: 13px;
                line-height: 1.6;
            }

            .footer {
                font-size: 13px;
                margin-top: 18px;
            }

            .char-controls button {
                font-size: 11px;
                padding: 6px 10px;
            }

            .speak-ai-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }

            .characters-container {
                gap: 15px;
                padding: 15px 5px;
            }
        }

        /* 加载提示 */
        .loading {
            display: none;
            color: #FF69B4;
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .loading.active {
            display: block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

    </style>
</head>
<body>

    <!-- 云朵装饰 -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="container">
        <h1>🎨 逍遥学习字帖 🌈</h1>
        
        <!-- 提示语 -->
        <div class="hint-text">
            <p>🌟 点击分类按钮选择字词，或输入1-4个汉字学习 🌟</p>
        </div>
        
        <!-- 分类选择 -->
        <div class="categories">
            <button class="category-btn" onclick="showCategory('animals')">🐾 动物</button>
            <button class="category-btn" onclick="showCategory('family')">👨‍👩‍👧‍👦 家人</button>
            <button class="category-btn" onclick="showCategory('plants')">🌱 植物</button>
            <button class="category-btn" onclick="showCategory('fruits')">🍎 水果</button>
            <button class="category-btn" onclick="showCategory('vegetables')">🥬 蔬菜</button>
            <button class="category-btn" onclick="showCategory('transport')">🚗 交通</button>
            <button class="category-btn" onclick="showCategory('colors')">🎨 颜色</button>
            <button class="category-btn" onclick="showCategory('numbers')">🔢 数字</button>
            <button class="category-btn" onclick="showCategory('weather')">☀️ 天气</button>
            <button class="category-btn" onclick="showCategory('body')">👋 身体</button>
        </div>

        <!-- 汉字卡片显示区 -->
        <div class="char-cards" id="charCards"></div>
        
        <div class="input-group">
            <input type="text" id="charInput" placeholder="输入1-4个汉字" maxlength="4" value="猫">
            <button onclick="loadCharacters()">🚀 开始学习</button>
        </div>

        <div class="loading" id="loading">✨ 正在加载中...</div>

        <!-- 多字符横向滑动容器 -->
        <div class="characters-container" id="charactersContainer"></div>

        <!-- 全局控制按钮 -->
        <div class="global-controls">
            <!-- 我来写开关 -->
            <div class="grid-toggle">
                <label for="quizSwitch">
                    <span>✍️ 我来写</span>
                </label>
                <label class="switch">
                    <input type="checkbox" id="quizSwitch" onchange="toggleQuizMode()">
                    <span class="slider"></span>
                </label>
            </div>
            
            <!-- 田字格开关 -->
            <div class="grid-toggle">
                <label for="gridSwitch">
                    <span>📐 田字格</span>
                </label>
                <label class="switch">
                    <input type="checkbox" id="gridSwitch" checked onchange="toggleGrid()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        let writers = []; // 改为数组存储多个writer
        const { pinyin } = pinyinPro; // 初始化拼音库
        let showGrid = true; // 田字格开关状态
        let currentChars = []; // 当前学习的汉字数组

        // 豆包 API 配置
        const DOUBAO_CONFIG = {
            baseUrl: 'https://ark.cn-beijing.volces.com/api/v3',
            apiKey: 'f2c6e53a-f138-45ce-aa3d-80139f45a583',
            model: 'doubao-seed-1-6-flash-250828'

        // 初始化加载

        // 核心功能：加载多个汉字
        function loadCharacters() {
            const input = document.getElementById('charInput').value.trim();
            
            // 验证输入：1-4个汉字
            if (!input || !/^[\u4e00-\u9fa5]{1,4}$/.test(input)) {
                alert("请输入1-4个中文汉字！");
                document.getElementById('charInput').focus();
                return;
            }

            // 显示加载状态
            const loading = document.getElementById('loading');
            loading.classList.add('active');

            try {
                // 将输入转换为字符数组
                currentChars = input.split('');
                writers = [];
                
                // 清空容器
                const container = document.getElementById('charactersContainer');
                container.innerHTML = '';
                
                // 单个字时添加居中样式
                if (currentChars.length === 1) {
                    container.classList.add('single-char');
                } else {
                    container.classList.remove('single-char');
                }

                // 为每个汉字创建独立的展示区
                currentChars.forEach((char, index) => {
                    createCharacterDisplay(char, index, container);
                });

                // 隐藏加载状态
                loading.classList.remove('active');
                
            } catch (error) {
                loading.classList.remove('active');
                console.error('加载汉字失败:', error);
                alert('加载汉字失败，请检查网络连接或尝试其他汉字');
            }
        }

        function createCharacterDisplay(char, index, container) {
            // 创建展示容器
            const displayDiv = document.createElement('div');
            displayDiv.className = 'character-display';
            displayDiv.id = `char-display-${index}`;

            // 获取拼音
            const py = pinyin(char, { toneType: 'symbol' });

            // 构建HTML结构
            displayDiv.innerHTML = `
                <div class="pinyin-display">${py}</div>
                <div class="grid-target" id="grid-target-${index}"></div>
                <div class="ai-tips" id="aiTips-${index}">
                    <div class="ai-tips-title">
                        <span>✨ 书写指导</span>
                        <button class="speak-ai-btn" onclick="speakAITips(${index})" title="听老师讲解">🔊</button>
                    </div>
                    <div class="ai-tips-content" id="aiTipsContent-${index}">
                        <div class="ai-tips-loading">正在思考</div>
                    </div>
                </div>
                <div class="char-controls">
                    <button class="btn-outline" onclick="animateChar(${index})">📝 笔顺动画</button>
                    <button class="btn-outline" onclick="speakChar(${index})">🔊 发音</button>
                </div>
            `;

            container.appendChild(displayDiv);

            const gridTarget = document.getElementById(`grid-target-${index}`);
            const containerWidth = gridTarget.offsetWidth || 260;
            const writerSize = Math.min(containerWidth, 260);

            };

            const writer = HanziWriter.create(`grid-target-${index}`, char, writerOptions);
            writers[index] = writer;

            setTimeout(() => addCustomGrid(writerSize, `grid-target-${index}`), 100);

        // 功能：播放指定汉字的发音
        function speakChar(index) {
            const char = currentChars[index];
            if (!char) return;
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const speakCharFunc = () => {
                    const utterance = new SpeechSynthesisUtterance(char);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    
                    utterance.onerror = function(event) {
                        console.error('语音播放错误:', event);
                        if (event.error === 'language-unavailable') {
                            useFallbackTTS(char);
                        }
                    };
                    
                    window.speechSynthesis.speak(utterance);
                };

                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.addEventListener('voiceschanged', function() {
                        speakCharFunc();
                    }, { once: true });
                    
                    setTimeout(() => {
                        if (window.speechSynthesis.speaking === false) {
                            speakCharFunc();
                        }
                    }, 3000);
                } else {
                    speakCharFunc();
                }
            } else {
                useFallbackTTS(char);
            }
        }

                };

                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.addEventListener('voiceschanged', function() {
                        speakTipsFunc();
                    }, { once: true });
                    
                    setTimeout(() => {
                        if (window.speechSynthesis.speaking === false) {
                            speakTipsFunc();
                        }
                    }, 3000);
                } else {
                    speakTipsFunc();
                }
            } else {
                useFallbackTTS(tipsText);
            }
        }

        // 备选TTS方案：使用百度或其他在线TTS服务
        function useFallbackTTS(text) {
            try {
                // 方案1：使用百度在线TTS（免费，无需API key）
                const audio = new Audio();
                // 百度TTS接口（有限制，仅作演示）
                const url = `https://fanyi.baidu.com/gettts?lan=zh&text=${encodeURIComponent(text)}&spd=3&source=web`;
                
                audio.src = url;
                audio.play().catch(err => {
                    console.error('音频播放失败:', err);
                    // 如果还是失败，提示用户
                    showToast('💡 请点击"🔊 听发音"按钮来播放语音');
                });
            } catch (error) {
                console.error('备选TTS失败:', error);
                showToast('⚠️ 语音播放暂时不可用');
            }
        }

        // 显示提示信息
        function showToast(message) {
            // 创建或获取提示元素
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 80px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(255, 105, 180, 0.95);
                    color: white;
                    padding: 12px 24px;
                    border-radius: 25px;
                    font-size: 14px;
                    font-weight: bold;
                    z-index: 9999;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                    animation: slideUp 0.3s ease-out;
                    max-width: 80%;
                    text-align: center;
                `;
                document.body.appendChild(toast);
                
                // 添加动画样式
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes slideUp {
                        from {
                            opacity: 0;
                            transform: translateX(-50%) translateY(20px);
                        }
                        to {
                            opacity: 1;
                            transform: translateX(-50%) translateY(0);
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            toast.textContent = message;
            toast.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // 监听回车键
        document.getElementById('charInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadCharacters();
            }
        });

        // 自动聚焦输入框
        document.getElementById('charInput').addEventListener('click', function() {
            this.select();
        });

        // 获取AI写法提示（改进版，支持索引）
        async function getAITips(char, index) {
            const aiTipsDiv = document.getElementById(`aiTips-${index}`);
            const aiTipsContent = document.getElementById(`aiTipsContent-${index}`);
            
            // 显示加载状态（使用淡入效果，不改变位置）
            aiTipsContent.innerHTML = '<div class="ai-tips-loading">正在思考</div>';
            aiTipsDiv.classList.add('show');
            
            // 优先使用本地知识库（准确可靠）
            if (charStructureDB[char]) {
                setTimeout(() => {
                    aiTipsContent.innerHTML = charStructureDB[char];
                }, 300); // 模拟思考过程
                return;
            }
            
            // 本地知识库没有，才调用豆包AI
            try {
                const systemPrompt = `你是汉字书写老师，专注结构布局。

【严禁】不说笔顺、序号、部首拆解
【要求】简洁！50字以内！

只说这4点：
1. 结构类型：左右/上下/包围/独体
2. 位置关系：上下对齐/左窄右宽/居中/偏上偏下
3. 笔画长短：中间最短/底下最长/上短下长
4. 关键形态：横要平/竖要直/撇捺舒展/方正圆润

例子：
"兰"→上下结构，上面两点向里收，下面三横中间最短底下最长，中横在字中间横线附近。
"叶"→左右结构，左边口在中间偏上，右边十字上比口高下比口低。
"国"→全包围，外框方正，里面玉字居中不能太大。

务必简短！直接说要点！`;

                const userPrompt = `"${char}"这个字的书写要点是什么？`;
                
                const response = await fetch(`${DOUBAO_CONFIG.baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DOUBAO_CONFIG.apiKey}`
                    },
                    body: JSON.stringify({
                        model: DOUBAO_CONFIG.model,
                        messages: [
                            {
                                role: 'system',
                                content: systemPrompt
                            },
                            {
                                role: 'user',
                                content: userPrompt
                            }
                        ],
                        temperature: 0.3,
                        max_tokens: 200
                    })
                });

                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }

                const data = await response.json();
                console.log('豆包API返回:', data);
                
                let aiResponse = data.choices?.[0]?.message?.content;
                
                if (aiResponse) {
                    aiResponse = aiResponse.trim();
                    console.log('AI原始回答:', aiResponse);
                    
                    // 严格过滤禁用词
                    const forbiddenWords = ['第', '笔', '先', '再', '然后', '接着', '组成', '部首', '偏旁', '由'];
                    const hasForbidden = forbiddenWords.some(word => aiResponse.includes(word));
                    
                    const isTooLong = aiResponse.length > 80;
                    const isTruncated = data.choices?.[0]?.finish_reason === 'length';
                    
                    if (hasForbidden || isTooLong || isTruncated) {
                        console.log('AI回答被过滤:', { hasForbidden, isTooLong, isTruncated });
                        aiTipsContent.innerHTML = '注意整体平衡，横平竖直哦~';
                    } else {
                        aiTipsContent.innerHTML = aiResponse;
                    }
                } else {
                    console.log('AI无返回内容');
                    aiTipsContent.innerHTML = '注意整体平衡，横平竖直哦~';
                }
                
            } catch (error) {
                console.error('获取AI提示失败:', error);
                aiTipsContent.innerHTML = '注意整体平衡，横平竖直哦~';
            }
        }

        // 添加自定义田字格（改进版，支持指定目标）
        function addCustomGrid(size = 260, targetId) {
            setTimeout(() => {
                const svg = document.querySelector(`#${targetId} svg`);
                if (!svg) return;

                // 移除之前的田字格（如果有）
                const oldGrid = svg.querySelector('#custom-grid');
                if (oldGrid) oldGrid.remove();

                // 创建田字格组
                const gridGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                gridGroup.setAttribute('id', 'custom-grid');
                gridGroup.style.display = showGrid ? 'block' : 'none';

                // 获取 SVG 尺寸
                const width = size;
                const height = size;
                const halfW = width / 2;
                const halfH = height / 2;

                // 创建虚线样式
                const lineStyle = {
                    stroke: '#FFB6C1',
                    strokeWidth: '1.5',
                    strokeDasharray: '5,5',
                    strokeLinecap: 'round'
                };

                // 横向中线
                const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                hLine.setAttribute('x1', '0');
                hLine.setAttribute('y1', halfH.toString());
                hLine.setAttribute('x2', width.toString());
                hLine.setAttribute('y2', halfH.toString());
                Object.entries(lineStyle).forEach(([key, value]) => {
                    hLine.setAttribute(key, value);
                });

                // 纵向中线
                const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                vLine.setAttribute('x1', halfW.toString());
                vLine.setAttribute('y1', '0');
                vLine.setAttribute('x2', halfW.toString());
                vLine.setAttribute('y2', height.toString());
                Object.entries(lineStyle).forEach(([key, value]) => {
                    vLine.setAttribute(key, value);
                });

                // 添加到组
                gridGroup.appendChild(hLine);
                gridGroup.appendChild(vLine);

                // 插入到 SVG 的最前面（背景层）
                svg.insertBefore(gridGroup, svg.firstChild);
            }, 100);
        }

        // 切换田字格显示
        function toggleGrid() {
            showGrid = document.getElementById('gridSwitch').checked;
            const gridGroups = document.querySelectorAll('#custom-grid');
            gridGroups.forEach(gridGroup => {
                if (gridGroup) {
                    gridGroup.style.display = showGrid ? 'block' : 'none';
                }
            });
        }
    </script>
</body>
